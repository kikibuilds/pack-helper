<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>发货助手</strong>
    <span id="ver" class="ver"></span>
    <span id="platform" class="pill">—</span>
    <span id="count" class="count"></span>
  </header>

  <section class="actions">
    <button id="btnRunAll" class="primary">▶ 一键拉取订单（所有平台）</button>
    <div class="scopes">只拉一个平台：
      <button class="small" data-scope="poshmark">Poshmark</button>
      <button class="small" data-scope="mercari">Mercari</button>
      <button class="small" data-scope="depop">Depop</button>
    </div>
    <button id="btnRead">读取当前订单页</button>
    <button id="btnScan">扫描本页所有订单（测试版）</button>
    <button id="btnPdf">把当前标签页的 PDF 当作面单</button>
    <button id="btnDiag">复制本页诊断信息（发给开发者调规则）</button>
  </section>

  <form id="form" hidden>
    <div class="row">
      <img id="preview" alt="">
      <div class="grow">
        <label>平台
          <select id="f-platform">
            <option value="poshmark">Poshmark</option>
            <option value="mercari">Mercari</option>
            <option value="depop">Depop</option>
          </select>
        </label>
        <label>订单号 <input id="f-orderId"></label>
      </div>
    </div>
    <label>商品名 <textarea id="f-title" rows="2"></textarea></label>
    <div class="row">
      <label class="grow">SKU <input id="f-sku" placeholder="没有可以留空"></label>
      <label class="narrow">数量 <input id="f-qty" type="number" min="1" value="1"></label>
      <label class="narrow">运单后4位 <input id="f-last4" maxlength="4"></label>
    </div>
    <input id="f-imageUrl" type="hidden">
    <input id="f-url" type="hidden">
    <button id="btnAdd" class="primary" type="submit">加入今日批次</button>
  </form>

  <p id="status" class="status"></p>

  <footer>
    <button id="btnBatch" class="link">打开批次页（检查 / 打包下载）→</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
